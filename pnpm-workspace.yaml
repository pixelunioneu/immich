packages:
  - packages/**
  - docs
  - e2e
  - i18n
  - server
  - plugins
  - web
  - .github
  - packages/*
allowBuilds:
  '@nestjs/core': false
  '@parcel/watcher': false
  '@scarf/scarf': false
  '@swc/core': false
  bcrypt: true
  better-sqlite3: true
  canvas: false
  core-js: false
  cpu-features: false
  es5-ext: false
  esbuild: false
  msgpackr-extract: false
  protobufjs: false
  sharp: true
  ssh2: false
  utimes: false
  '@tailwindcss/oxide': true
  core-js-pure: false
  postman-code-generators: false
  '@sentry/cli': false
  unrs-resolver: false
overrides:
  canvas: 3.2.3
  sharp: ^0.35.3
  # 1.9.3-1.9.5 are confirmed broken
  tsc-alias: 1.9.9
  # PixelUnion: one OpenTelemetry API for the whole workspace. Sentry's SDK still pulls in
  # 1.9.x next to Immich's 1.10.x; two copies cannot share the global registry, so with
  # SENTRY_DSN set the server's Prometheus metrics came out empty, and web's vitest got a
  # second instance. Drop this once Sentry supports @opentelemetry/api 1.10.
  '@opentelemetry/api': 1.10.0
packageExtensions:
  nestjs-kysely:
    dependencies:
      tslib: '*'
  nestjs-otel:
    dependencies:
      tslib: '*'
  '@photo-sphere-viewer/equirectangular-video-adapter':
    dependencies:
      three: '*'
  '@photo-sphere-viewer/video-plugin':
    dependencies:
      three: '*'
  sharp:
    dependencies:
      node-addon-api: '*'
      node-gyp: '*'
  '@immich/ui':
    dependencies:
      tailwindcss: '>=4.1'
  tailwind-variants:
    dependencies:
      tailwindcss: '>=4.1'
  bcrypt:
    dependencies:
      node-addon-api: '*'
      node-gyp: '*'
  '@nestjs/swagger':
    peerDependencies:
      typescript: '*'
dedupePeerDependents: false
preferWorkspacePackages: true
injectWorkspacePackages: true
shamefullyHoist: false
verifyDepsBeforeRun: install
minimumReleaseAgeExclude:
  - '@immich/ui'
  - '@immich/sql-tools@0.7.0'
  - '@nestjs/cli@12.0.1'
  - '@futo-org/*'

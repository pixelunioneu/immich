[tasks.install]
run = "pnpm install --filter @immich/frontdoor --frozen-lockfile"

[tasks.codegen]
env._.path = "./node_modules/.bin"
run = [
  "vite build --config vite.codegen.config.ts",
  "node dist-codegen/generate-contract.cjs",
  # The repo sorts JSON keys via prettier-plugin-sort-json, so the generated file
  # has to go through prettier too. Without this the drift check below fails on
  # formatting alone, every run.
  "prettier --write src/generated/contract.json",
]

[tasks.build]
env._.path = "./node_modules/.bin"
run = "vite build"

[tasks.test]
env._.path = "./node_modules/.bin"
run = "vitest"

# Needs Docker. Runs test/medium/*.spec.ts on the server's own medium-test
# harness (its testcontainers Postgres, migrations and SyncTestContext) so the
# front door's decision is checked against the real sync service on a real
# database. Nothing is shimmed there: only the spec directory differs from the
# server's own medium run.
[tasks."test-medium"]
dir = "../../server"
# mise resolves env._.path against this config's directory, not `dir`, so the
# plain "./node_modules/.bin" used by the other tasks here would put the front
# door's own vitest on PATH while cwd is the server. That binary resolves the
# server's imports from packages/frontdoor and its type-only imports
# (`Generated` from @immich/sql-tools, from kysely) then fail as missing named
# exports. The server's harness has to run on the server's vitest.
env._.path = "../../server/node_modules/.bin"
run = "vitest --run --config test/vitest.config.frontdoor-medium.mjs"

[tasks.check]
env._.path = "./node_modules/.bin"
run = "tsc --noEmit"

[tasks.format]
env._.path = "./node_modules/.bin"
run = "prettier --check ."

[tasks."format-fix"]
env._.path = "./node_modules/.bin"
run = "prettier --write ."

# Regenerates the API contract from the server sources and fails if the result
# differs from what is committed. This is the drift detector: an upstream change
# to the supported media types or the sync entity types has to surface here
# rather than in production.
[tasks."check-contract"]
run = [
  { task = ":codegen" },
  "git diff --exit-code src/generated/contract.json",
]

# Mirrors //server:ci-medium. The medium specs import the server, which pulls in
# @immich/plugin-sdk -- a workspace package that resolves through ./dist, so it
# has to be built or vitest cannot even collect the specs.
[tasks.ci-medium]
run = [
  { task = "//server:install" },
  { task = ":install" },
  { task = "//:plugins" },
  { task = "//packages/plugin-core:build" },
  { task = ":test-medium" },
]

[tasks.ci-unit]
run = [
  { task = ":install" },
  { task = ":format" },
  { task = ":check" },
  { task = ":check-contract" },
  { task = ":test --run" },
]

[tasks.checklist]
run = [{ task = ":ci-unit" }, { task = ":ci-medium" }]
